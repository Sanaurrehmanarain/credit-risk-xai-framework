<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="788px" height="1772px" viewBox="0 0 788 1772">
<rect width="100%" height="100%" fill="white"/>
<g font-family="DejaVu Sans Mono, Noto Sans Mono, Consolas, monospace" font-size="16px" xml:space="preserve" fill="black"><text x="28" y="44">╔══════════════════════════════════════════════════════════════════════╗</text><text x="28" y="66">║  ALGORITHM 1 — Credit Default Prediction with Fairness Audit         ║</text><text x="28" y="88">╠══════════════════════════════════════════════════════════════════════╣</text><text x="28" y="110">║  INPUT   D : OpenIntro Loans dataset                                 ║</text><text x="28" y="132">║          A : protected attribute (income-bracket proxy)              ║</text><text x="28" y="154">║  OUTPUT  f*: fitted classifier      τ*: decision threshold           ║</text><text x="28" y="176">║          Φ : SHAP attributions      R : fairness report              ║</text><text x="28" y="198">╚══════════════════════════════════════════════════════════════════════╝</text><text x="28" y="220"></text><text x="28" y="242">┌─ PHASE 1 ─ Ingestion &amp; Leakage Control ──────────────────────────────┐</text><text x="28" y="264">  1.1   D  ← load(OpenIntro_Loans_Data)</text><text x="28" y="286">  1.2   y  ← 1 if loan_status ∈ {Charged Off, Default} else 0</text><text x="28" y="308">  1.3   L  ← {paid_principal, paid_interest, paid_total,</text><text x="28" y="330">              paid_late_fees, loan_status}          ▹ post-origination</text><text x="28" y="352">  1.4   X  ← D ∖ (L ∪ {y})</text><text x="28" y="374">  1.5   ASSERT ∀ x ∈ X : observable_at(x) ≤ t₀      ▹ origination time</text><text x="28" y="396">└──────────────────────────────────────────────────────────────────────┘</text><text x="28" y="418"></text><text x="28" y="440">┌─ PHASE 2 ─ Partitioning  (before any parameter is fitted) ───────────┐</text><text x="28" y="462">  2.1   X_tr, X_te, y_tr, y_te ← stratified_split(X, y, .30, seed=42)</text><text x="28" y="484">  2.2   X_tr, X_va, y_tr, y_va ← stratified_split(X_tr, y_tr, .20, seed=42)</text><text x="28" y="506">        ▹ X_va carries threshold selection; X_te is opened exactly once</text><text x="28" y="528">└──────────────────────────────────────────────────────────────────────┘</text><text x="28" y="550"></text><text x="28" y="572">┌─ PHASE 3 ─ Preprocessing Pipeline  (fitted on X_tr only) ────────────┐</text><text x="28" y="594">  3.1   T_num ← MedianImputer ∘ StandardScaler        ▹ scaler for LogReg</text><text x="28" y="616">  3.2   T_cat ← ModeImputer   ∘ OneHotEncoder(handle_unknown=&#x27;ignore&#x27;)</text><text x="28" y="638">  3.3   T     ← ColumnTransformer(T_num, T_cat)</text><text x="28" y="660">  3.4   T.fit(X_tr)                                   ▹ never on X_va/X_te</text><text x="28" y="682">└──────────────────────────────────────────────────────────────────────┘</text><text x="28" y="704"></text><text x="28" y="726">┌─ PHASE 4 ─ Imbalance Mitigation  (inside CV folds only) ─────────────┐</text><text x="28" y="748">  4.1   S ← SMOTENC(categorical_features = idx_cat, seed = 42)</text><text x="28" y="770">  4.2   P ← ImbPipeline([ T , S , classifier ])</text><text x="28" y="792">        ▹ pipeline form guarantees resampling never leaks across folds</text><text x="28" y="814">└──────────────────────────────────────────────────────────────────────┘</text><text x="28" y="836"></text><text x="28" y="858">┌─ PHASE 5 ─ Model Training &amp; Selection ───────────────────────────────┐</text><text x="28" y="880">  5.1   M ← {LightGBM, XGBoost, RandomForest, LogisticRegression}</text><text x="28" y="902">  5.2   FOR EACH m ∈ M:</text><text x="28" y="924">  5.3       θ_m ← RandomisedSearchCV(P(m), StratifiedKFold(k=5),</text><text x="28" y="946">                                     scoring = &#x27;average_precision&#x27;)</text><text x="28" y="968">  5.4   f*  ← argmax_m  CV_score(θ_m)</text><text x="28" y="990">  5.5   BASELINE: refit f* with class_weight=&#x27;balanced&#x27; instead of SMOTE</text><text x="28" y="1012">        ▹ reports whether resampling actually earned its place</text><text x="28" y="1034">└──────────────────────────────────────────────────────────────────────┘</text><text x="28" y="1056"></text><text x="28" y="1078">┌─ PHASE 6 ─ Threshold Optimisation  (validation set) ─────────────────┐</text><text x="28" y="1100">  6.1   p_va ← f*.predict_proba(X_va)[:, 1]</text><text x="28" y="1122">  6.2   τ*   ← argmax_τ  [ F1(y_va, p_va ≥ τ) ]</text><text x="28" y="1144">              or  argmin_τ [ C_FN·FN(τ) + C_FP·FP(τ) ]   ▹ cost-sensitive</text><text x="28" y="1166">└──────────────────────────────────────────────────────────────────────┘</text><text x="28" y="1188"></text><text x="28" y="1210">┌─ PHASE 7 ─ Final Evaluation  (held-out test set, single pass) ───────┐</text><text x="28" y="1232">  7.1   p_te ← f*.predict_proba(X_te)[:, 1]</text><text x="28" y="1254">  7.2   ŷ_te ← p_te ≥ τ*</text><text x="28" y="1276">  7.3   REPORT  PR-AUC, ROC-AUC, Precision, Recall, F1,</text><text x="28" y="1298">                Brier score, calibration curve, confusion matrix</text><text x="28" y="1320">        ▹ SMOTE distorts the prior — calibration must be checked</text><text x="28" y="1342">└──────────────────────────────────────────────────────────────────────┘</text><text x="28" y="1364"></text><text x="28" y="1386">┌─ PHASE 8 ─ Explainability ───────────────────────────────────────────┐</text><text x="28" y="1408">  8.1   E ← SHAP.TreeExplainer(f*)</text><text x="28" y="1430">  8.2   Φ ← E.shap_values(X_te)</text><text x="28" y="1452">  8.3   RANK features by mean(|Φ|)     ▹ expect interest_rate, DTI, grade</text><text x="28" y="1474">  8.4   PLOT beeswarm + dependence(interest_rate, DTI)</text><text x="28" y="1496">        ▹ base value reflects the resampled prior, not population rate</text><text x="28" y="1518">└──────────────────────────────────────────────────────────────────────┘</text><text x="28" y="1540"></text><text x="28" y="1562">┌─ PHASE 9 ─ Fairness Audit ───────────────────────────────────────────┐</text><text x="28" y="1584">  9.1   A ← income_bracket(X_te)       ▹ groups: low vs. high</text><text x="28" y="1606">  9.2   FOR EACH group a ∈ A:</text><text x="28" y="1628">  9.3       COMPUTE  FPR_a , FNR_a , TPR_a , selection_rate_a</text><text x="28" y="1650">  9.4   ΔEO  ← max_a TPR_a − min_a TPR_a            ▹ equal opportunity</text><text x="28" y="1672">  9.5   DI   ← min_a sel_a / max_a sel_a            ▹ 80% rule threshold</text><text x="28" y="1694">  9.6   R    ← {ΔEO, DI, per-group confusion matrices}</text><text x="28" y="1716">  9.7   IF DI &lt; 0.80: FLAG disparate impact; document mitigation</text><text x="28" y="1738">└──────────────────────────────────────────────────────────────────────┘</text></g>
</svg>
